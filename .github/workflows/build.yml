name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Собрать структуру проекта
        run: |
          mkdir -p app/src/main/java/com/example/dash app/src/main/res/drawable
          cp MainActivity.kt app/src/main/java/com/example/dash/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp car.jpg app/src/main/res/drawable/car.jpg

          cat > settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "dash"
          include(":app")
          EOT

          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOT

          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.dash"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.dash"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOT

          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: panel-apk
          path: app/build/outputs/apk/debug/app-debug.apk
